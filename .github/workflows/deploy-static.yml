name: Deploy static portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Pipeline: legacy (rollback, static site/) or web (Astro redesign, GitHub Pages only)"
        type: choice
        options: [legacy, web]
        default: legacy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-portfolio-production
  cancel-in-progress: false

env:
  PIPELINE: ${{ github.event.inputs.pipeline || 'legacy' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate portfolio (legacy)
        if: env.PIPELINE == 'legacy'
        run: npm run check
      - name: Validate portfolio (web)
        if: env.PIPELINE == 'web'
        run: npm run check:all

  github-pages:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build GitHub Pages artifact (legacy)
        if: env.PIPELINE == 'legacy'
        env:
          RELEASE_TARGET: github-pages
        run: npm run build:release
      - name: Build GitHub Pages artifact (web)
        if: env.PIPELINE == 'web'
        run: |
          npm --prefix web ci
          npm --prefix web run build
          node scripts/web-release-manifest.mjs
          mv web/dist dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-worker:
    needs: validate
    if: env.PIPELINE == 'legacy'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker
      url: ${{ vars.CLOUDFLARE_PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Cloudflare Worker artifact
        env:
          RELEASE_TARGET: cloudflare-worker
        run: npm run build:release
      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy
