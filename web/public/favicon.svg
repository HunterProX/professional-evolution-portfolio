<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cristian Cardona">
  <!-- Monogram favicon: the same two colours as the dark theme tokens
       (--color-bg #0a192f, --color-accent #64ffda), so the tab icon matches
       the site. Rounded square rather than a full-bleed rect so light browser
       chrome still shows the shape. -->
  <rect width="64" height="64" rx="12" fill="#0a192f" />
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="28"
    font-weight="700"
    fill="#64ffda"
  >CC</text>
</svg>
